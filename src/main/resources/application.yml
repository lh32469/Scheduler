spring:
  application:
    name: WebTemplate
  devtools:
    restart:
      # Trigger full restart on any changes under src/main/resources/static
      # Override Boot's default exclude list (which normally ignores static/**)
      exclude: ""
  thymeleaf:
    cache: false
  web:
    resources:
      add-mappings: true
  cache:
    type: caffeine
    cache-names: documentStore, anotherCache
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m

info:
  app:
    name: ${spring.application.name}
    description: WebTemplate Spring Boot application
    version: ${project.version:0.0.1-SNAPSHOT}


management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
