spring:
  application:
    name: WebTemplate

info:
  app:
    name: ${spring.application.name}
    description: WebTemplate Spring Boot application
    version: ${project.version:0.0.1-SNAPSHOT}

management:
  endpoints:
    web:
      # Explicitly expose basic endpoints over HTTP
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
