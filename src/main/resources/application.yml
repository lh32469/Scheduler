spring:
  application:
    name: WebTemplate
  devtools:
    restart:
      # Trigger full restart on any changes under src/main/resources/static
      # Override Boot's default exclude list (which normally ignores static/**)
      exclude: ""
  thymeleaf:
    cache: false
  web:
    resources:
      add-mappings: true

info:
  app:
    name: ${spring.application.name}
    description: WebTemplate Spring Boot application
    version: ${project.version:0.0.1-SNAPSHOT}

management:
  endpoints:
    web:
      # Explicitly expose basic endpoints over HTTP
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# RavenDB Configuration
ravendb:
  database: FitHub
  urls: http://raven.dell.mcquarrie.cc
