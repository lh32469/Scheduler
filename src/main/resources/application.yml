server:
  port: 8085
  http2:
    enabled: true
  tomcat:
    redirect-context-root: false
  servlet:
    session:
      # Set HTTP session idle timeout to 2 hours
      timeout: 2h
  shutdown: immediate

management:
  server:
    port: 8090
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: Scheduler
  devtools:
    restart:
      # Trigger full restart on any changes under src/main/resources/static
      # Override Boot's default exclude list (which normally ignores static/**)
      exclude: ""
  thymeleaf:
    cache: false
  web:
    resources:
      add-mappings: true
  cache:
    type: caffeine
  mail:
    host: smtp.gmail.com
    port: 587
    username: permits.pdx@gmail.com
    # Encrypted via jasypt-spring-boot. Generate your own ciphertext with the provided tool
    # (see org.gpc4j.web.util.JasyptEncryptorTool) and set JASYPT_ENCRYPTOR_PASSWORD at runtime.
    # Example placeholder below — replace with your actual ENC(...) value.
    password: "ENC(PsOp12NNssxsKMZ9bBJAIiZRwSfQkexswXXFPOLQPBY9EMDPXEn6tGloqSp8N1ob3TMSFEDGwpLFxWSx29U7fg==)"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Jasypt (property encryption) configuration. The decrypt password is provided via
# environment variable JASYPT_ENCRYPTOR_PASSWORD (recommended) or system property of the same name.
# The algorithm below requires JCE unlimited strength (Java 9+ includes it by default).
jasypt:
  encryptor:
    algorithm: PBEWITHHMACSHA512ANDAES_256
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator

info:
  app:
    name: ${spring.application.name}
    description: Class & Service Scheduling Application
    version: ${project.version:3.0}

