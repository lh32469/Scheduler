<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitHub - Exercise Class Schedule</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #667eea;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 4rem 0;
            color: white;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeInUp 1s ease forwards;
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeInUp 1s ease 0.3s forwards;
        }

        /* Filter Section */
        .filters {
            background: white;
            padding: 2rem 0;
            margin: 2rem 0;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .filter-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 25px;
            background: #f8f9fa;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-btn.active,
        .filter-btn:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        /* Schedule Grid */
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
        }

        .class-card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 0.6s ease forwards;
        }

        .class-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
        }

        .class-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .class-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .class-type {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .class-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin: 1rem 0;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #666;
        }

        .detail-item i {
            color: #667eea;
            width: 16px;
        }

        .instructor {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 10px;
            margin: 1rem 0;
        }

        .instructor-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 0.3rem;
        }

        .instructor-bio {
            font-size: 0.9rem;
            color: #666;
        }

        .book-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .book-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .hidden {
            display: none;
        }

        /* Animations */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2rem;
            }

            .class-details {
                grid-template-columns: 1fr;
            }

            nav ul {
                flex-direction: column;
                gap: 1rem;
            }

            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>
<header>
    <div class="container">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-dumbbell"></i> FitHub
            </div>
            <nav>
                <ul>
                    <li><a href="#home">Home</a></li>
                    <li><a href="#schedule">Schedule</a></li>
                    <li><a href="#instructors">Instructors</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>

<main>
    <section class="hero">
        <div class="container">
            <h1>Find Your Perfect Workout</h1>
            <p>Join our diverse range of fitness classes led by expert instructors</p>
        </div>
    </section>

    <section class="container">
        <div class="filters">
            <div class="filter-controls">
                <button class="filter-btn active" data-filter="all">All Classes</button>
                <button class="filter-btn" data-filter="yoga">Yoga</button>
                <button class="filter-btn" data-filter="cardio">Cardio</button>
                <button class="filter-btn" data-filter="strength">Strength</button>
                <button class="filter-btn" data-filter="dance">Dance</button>
                <button class="filter-btn" data-filter="pilates">Pilates</button>
            </div>
        </div>

        <div class="schedule-grid" id="scheduleGrid">
            <!-- Class cards will be generated here -->
        </div>
    </section>
</main>

<script>
    // Load class data from API instead of static sample
    let classes = [];

    function mapOfferingToCard(o) {
        return {
            name: o.className ?? 'Untitled Class',
            type: o.classType ?? 'general',
            time: o?.schedule?.time ?? '',
            start: o?.schedule?.start ?? '',
            day: o?.schedule?.day ?? '',
            duration: o?.schedule?.duration ?? '',
            level: o.level ?? '',
            instructor: o?.instructor?.name ?? '',
            bio: o?.instructor?.bio ?? '',
            spots: o.slots + " spots available"
        };
    }

    async function loadClasses() {
        try {
            const res = await fetch('/api/offerings', {headers: {'Accept': 'application/json'}});
            if (!res.ok) throw new Error('Failed to load offerings: ' + res.status);
            const data = await res.json();
            classes = Array.isArray(data) ? data.map(mapOfferingToCard) : [];
        } catch (e) {
            console.error('Error loading classes from /api/offerings:', e);
            classes = [];
        }
    }

    // Generate class cards
    function renderClasses(classesToRender = classes) {
        const grid = document.getElementById('scheduleGrid');
        grid.innerHTML = '';

        classesToRender.forEach((classItem, index) => {
            const card = document.createElement('div');
            card.className = 'class-card';
            card.dataset.type = classItem.type;
            card.style.animationDelay = `${index * 0.1}s`;

            card.innerHTML = `
                    <div class="class-header">
                        <div>
                            <div class="class-name">${classItem.name}</div>
                        </div>
                        <div class="class-type">${classItem.type.charAt(0).toUpperCase() + classItem.type.slice(1)}</div>
                    </div>

                    <div class="class-details">
                        <div class="detail-item">
                            <i class="fas fa-clock"></i>
                            <span>${new Date(classItem.start).toLocaleString()}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-calendar"></i>
                            <span>${new Date(classItem.start).toLocaleDateString('en', {weekday: 'long'})}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-hourglass-half"></i>
                            <span>${classItem.duration}</span>
                        </div>
                        <div class="detail-item">
                            <i class="fas fa-signal"></i>
                            <span>${classItem.level}</span>
                        </div>
                    </div>

                    <div class="instructor">
                        <div class="instructor-name">
                            <i class="fas fa-user"></i> ${classItem.instructor}
                        </div>
                        <div class="instructor-bio">${classItem.bio}</div>
                    </div>

                    <div class="detail-item" style="color: #28a745; font-weight: 500;">
                        <i class="fas fa-users"></i>
                        <span>${classItem.spots}</span>
                    </div>

                    <button class="book-btn" onclick="bookClass('${classItem.name}')">
                        <i class="fas fa-bookmark"></i> Book This Class
                    </button>
                `;

            grid.appendChild(card);
        });
    }

    // Filter functionality
    function setupFilters() {
        const filterBtns = document.querySelectorAll('.filter-btn');

        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                // Update active button
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                // Filter classes
                const filter = btn.dataset.filter;
                if (filter === 'all') {
                    renderClasses(classes);
                } else {
                    const filteredClasses = classes.filter(c => c.type === filter);
                    renderClasses(filteredClasses);
                }
            });
        });
    }

    // Book class function
    async function bookClass(className) {
        // Find the class data
        const classData = classes.find(c => c.name === className);
        if (!classData) {
            alert('Class not found!');
            return;
        }

        // Prepare booking data
        const bookingData = {
            className: classData.name,
            classType: classData.type,
            schedule: {
                time: classData.time,
                day: classData.day,
                duration: classData.duration
            },
            level: classData.level,
            instructor: {
                name: classData.instructor,
                bio: classData.bio
            },
            availability: classData.spots,
            bookingTimestamp: new Date().toISOString(),
            customerInfo: {
                // This would typically come from a form or user session
                bookingId: 'BOOK_' + Date.now(),
                requestSource: 'website'
            }
        };

        try {
            // Show booking in progress
            const bookingBtn = event.target;
            const originalText = bookingBtn.innerHTML;
            bookingBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Booking...';
            bookingBtn.disabled = true;

            // Send POST request
            const response = await fetch('/api/bookings', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(bookingData)
            });

            // Handle response
            if (response.ok) {
                const result = await response.json();
                alert(`✅ Booking Confirmed!\n\nClass: ${classData.name}\nBooking ID: ${bookingData.customerInfo.bookingId}\n\nYou'll receive a confirmation email shortly.`);

                // Log the booking data for demo purposes
                console.log('Booking data sent:', bookingData);
                console.log('Server response:', result);
            } else {
                throw new Error(`Server error: ${response.status}`);
            }
        } catch (error) {
            console.error('Booking error:', error);
            console.log('Attempted to send booking data:', bookingData);

            // Show user-friendly error message
            alert(`❌ Booking failed: ${error.message}\n\nPlease try again or contact support.\n\n(Check console for technical details)`);
        } finally {
            // Reset button
            const bookingBtn = document.querySelector(`button[onclick*="${className}"]`);
            if (bookingBtn) {
                bookingBtn.innerHTML = originalText;
                bookingBtn.disabled = false;
            }
        }
    }

    // Initialize the page
    document.addEventListener('DOMContentLoaded', async () => {
        await loadClasses();
        renderClasses();
        setupFilters();

        // Add smooth scrolling to navigation links
        document.querySelectorAll('nav a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });
    });
</script>
</body>
</html>
