
# RavenDB Configuration
ravendb:
  url: http://raven.raven:8080

logging:
  level:
    root: INFO
    net.ravendb.client: WARN
  pattern:
    dateformat: MM-dd HH:mm:ss.SSSS,America/Los_Angeles
    console: "${CONSOLE_LOG_PATTERN:-%clr(%d{HH:mm:ss.SSSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(---){faint} %clr(%-25.35logger{1}.%M){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}}"

