<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<header>
    <div class="container">
        <div class="header-content">
            <div class="logo" th:text="${banner.companyName}">FitHub</div>
            <nav>
                <ul>
                    <li><a th:href="@{/}">Home</a></li>
                    <!-- Authenticated: Reset Password -->
                    <li sec:authorize="isAuthenticated()">
                        <a th:href="@{/account/password}">Reset Password</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</header>

<main class="container" style="padding-top: 2rem; padding-bottom: 3rem; max-width: 760px;">
    <h1>My Account</h1>

    <div th:if="${message}" th:classappend="${messageType} == 'error' ? ' error' : ' info'"
         style="margin: 1rem 0; padding: 1rem; border-radius: 8px; background: #e6f4ff; color: #084298;">
        <span th:text="${message}"></span>
    </div>

    <div class="class-card" style="display:grid; gap:1rem;">
        <div>
            <div style="color:#6c757d; font-size:.9rem;">Username (email)</div>
            <div style="font-weight:600;" th:text="${username}">user@example.com</div>
        </div>

        <form th:action="@{/account/profile}" method="post" th:object="${form}" style="display:grid; gap:1rem;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <label>
                Full Name
                <input type="text" th:field="*{name}" placeholder="Your full name" required/>
            </label>

            <label>
                Profile / Bio
                <textarea th:field="*{profile}" rows="6" placeholder="Tell others about yourself (optional)"
                          style="width:100%; resize:vertical;"></textarea>
            </label>

            <div class="actions" style="display:flex; gap:.5rem;">
                <button class="book-btn" type="submit">Save Changes</button>
                <a class="book-btn" style="background:#6c757d;" th:href="@{/}">Cancel</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
