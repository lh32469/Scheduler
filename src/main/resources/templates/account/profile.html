<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head}"></head>
<body class="account-profile">

<style>
    /* Increase base font size on desktop for the Account/Profile page only */
    @media (min-width: 992px) {
        :root { font-size: 112.5%; } /* 18px if browser default is 16px */
    }
    /* No change for tablets/phones */
</style>

<header>
    <div class="container">
        <div class="header-content">
            <div class="logo" th:text="${banner.companyName}">FitHub</div>
            <nav>
                <ul>
                    <li><a th:href="@{/}">Home</a></li>
                    <!-- Authenticated: Reset Password -->
                    <li sec:authorize="isAuthenticated()">
                        <a th:href="@{/account/password}">Reset Password</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</header>

<main class="container" style="padding-top: 2rem; padding-bottom: 3rem; max-width: 760px;">
    <h1>My Account</h1>

    <div th:if="${message}" th:classappend="${messageType} == 'error' ? ' error' : ' info'"
         style="margin: 1rem 0; padding: 1rem; border-radius: 8px; background: #e6f4ff; color: #084298;">
        <span th:text="${message}"></span>
    </div>

    <div class="class-card" style="display:grid; gap:1rem;">
        <div>
            <div style="color:#6c757d; font-size:.9rem;">Username (email)</div>
            <div style="font-weight:600;" th:text="${username}">user@example.com</div>
        </div>

        <form th:action="@{/account/profile}" method="post" th:object="${form}" style="display:grid; gap:1rem;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <label>
                Full Name
                <input type="text" th:field="*{name}" placeholder="Your full name" required/>
            </label>

            <label>
                Profile / Bio
                <textarea th:field="*{profile}" rows="6" placeholder="Tell others about yourself (optional)"
                          style="width:100%; resize:vertical;"></textarea>
            </label>

            <!-- Instructor-only: Service Types -->
            <div th:if="${isInstructor}">
                <div style="font-weight:600; margin-bottom:.25rem;">Service Types</div>
                <div style="color:#6c757d; font-size:.9rem; margin-bottom:.5rem;">
                    Select the services you offer. This is shown on the Instructors page and may be used for filtering.
                </div>
                <style>
                    .svc-grid { display:flex; flex-wrap:wrap; gap:.5rem 1rem; }
                    .svc-grid label { display:inline-flex; align-items:center; gap:.4rem; font-weight:600; color:#0b5ed7; }
                </style>
                <div class="svc-grid">
                    <label th:each="t : ${T(org.gpc4j.web.api.ServiceType).values()}">
                        <input type="checkbox" th:field="*{serviceTypes}" th:value="${t}"/>
                        <span th:text="${#strings.capitalize(t.name())}">Type</span>
                    </label>
                </div>
            </div>

            <div class="actions" style="display:flex; gap:.5rem;">
                <button class="book-btn" type="submit">Save Changes</button>
                <a class="book-btn" style="background:#6c757d;" th:href="@{/}">Cancel</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
