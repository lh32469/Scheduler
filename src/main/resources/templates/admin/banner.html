<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<header>
    <div class="container">
        <div class="header-content">
            <div class="logo">Admin · Banner</div>
            <nav>
                <ul>
                    <li><a th:href="@{/}">Home</a></li>
                    <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin/users}">Users</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>

<main class="container" style="padding-top: 2rem; padding-bottom: 3rem; max-width: 760px;">
    <h1>Banner Settings</h1>

    <div th:if="${message}" th:classappend="${messageType} == 'error' ? ' error' : ' info'"
         style="margin: 1rem 0; padding: 1rem; border-radius: 8px; background: #e6f4ff; color: #084298;">
        <span th:text="${message}"></span>
    </div>

    <form th:action="@{/admin/banner}" method="post" th:object="${banner}" class="class-card" style="display:grid; gap:1rem;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label>
            Company Name
            <input type="text" th:field="*{companyName}" placeholder="FitHub"/>
        </label>

        <label>
            Tab Title (browser tab)
            <input type="text" th:field="*{tabTitle}" placeholder="FitHub"/>
        </label>

        <label>
            Main Title (home page)
            <input type="text" th:field="*{title}" placeholder="Welcome to FitHub"/>
        </label>

        <label>
            Subtitle
            <input type="text" th:field="*{subTitle}" placeholder="Stronger every day"/>
        </label>

        <div class="actions" style="display:flex; gap:.5rem;">
            <button class="book-btn" type="submit">Save Banner</button>
            <a class="book-btn" style="background:#6c757d;" th:href="@{/admin/users}">Cancel</a>
        </div>
    </form>

    <div style="margin-top:1.5rem;">
        <a class="filter-btn" th:href="@{/admin/users}">Go to User Management</a>
    </div>
</main>

</body>
</html>
