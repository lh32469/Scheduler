<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<header>
    <div class="container">
        <div class="header-content">
            <div class="logo" th:text="${title} ?: 'Schedule New Class'">Schedule New Class</div>
            <nav>
                <ul>
                    <li><a th:href="@{/}">Home</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>
<main class="container" style="margin-top: 2rem;">
    <h2 th:text="${isEdit} ? 'Edit Class' : 'Schedule a New Class'">Schedule a New Class</h2>

    <div th:if="${message}"
         th:classappend="${messageType} == 'error' ? ' error' : ' info'"
         style="margin: 1rem 0; padding: 1rem; border-radius: 8px; background: #fdecea; color: #611a15;">
        <span th:text="${message}"></span>
    </div>

    <form th:action="${isEdit} ? @{/offerings/{id}(id=${schedule.id})} : @{/offerings}"
          method="post" th:object="${schedule}" class="form"
          style="display: grid; gap: 1rem; max-width: 640px;">

        <label>
            Class Name
            <input type="text" th:field="*{className}" placeholder="Morning Flow Yoga" required/>
        </label>

        <label>
            Description
            <textarea th:field="*{classDescription}"
                      placeholder="Briefly describe this class (focus, format, who it's for)"
                      rows="4" maxlength="500"
                      style="width:100%; resize: vertical;"></textarea>
            <small style="color:#6c757d;">Up to 500 characters.</small>
        </label>

        <label>
            Class Type
            <select th:field="*{classType}" required>
                <option value="" disabled th:selected="${schedule.classType} == null">Select a class type</option>
                <option th:each="ct : ${T(org.gpc4j.web.api.ClassType).values()}"
                        th:value="${ct}"
                        th:text="${ct}"></option>
            </select>
        </label>

        <label>
            Level
            <input type="text" th:field="*{level}" placeholder="All Levels"/>
        </label>

        <label>
            Start Week (Sunday of first week)
            <input type="date" th:field="*{startWeek}" required/>
        </label>

        <label>
            Number of Weeks (0 = ongoing)
            <input type="number" min="0" th:field="*{numberOfWeeks}"/>
        </label>

        <div>
            <div style="margin-bottom: .25rem; font-weight: 600;">Days of Week</div>

            <!-- Quick select controls -->
            <div style="display:flex; flex-wrap: wrap; gap:.5rem; margin-bottom:.5rem;">
                <button type="button" class="book-btn" style="width:auto; padding:.35rem .6rem; background:#6c757d;" data-days-action="weekdays">Weekdays</button>
                <button type="button" class="book-btn" style="width:auto; padding:.35rem .6rem; background:#6c757d;" data-days-action="weekends">Weekends</button>
                <button type="button" class="book-btn" style="width:auto; padding:.35rem .6rem; background:#6c757d;" data-days-action="mwf">Mon,Wed,Fri</button>
                <button type="button" class="book-btn" style="width:auto; padding:.35rem .6rem; background:#6c757d;" data-days-action="tt">Tue,Thu</button>
                <button type="button" class="book-btn" style="width:auto; padding:.35rem .6rem; background:#6c757d;" data-days-action="all">All</button>
                <button type="button" class="book-btn" style="width:auto; padding:.35rem .6rem; background:#adb5bd;" data-days-action="clear">Clear</button>
            </div>

            <!-- Chip-style day selector (uses native checkboxes for binding) -->
            <style>
                .day-grid { display:grid; grid-template-columns: repeat(7, minmax(48px, 1fr)); gap:.5rem; }
                .day-chip { position: relative; display:inline-flex; align-items:center; justify-content:center; padding:.5rem 0; border:1px solid #ced4da; border-radius: 999px; cursor:pointer; user-select:none; transition: all .15s ease; background:#fff; font-weight:600; }
                .day-chip.selected { background:#0d6efd; color:#fff; border-color:#0d6efd; }
                .day-chip:hover { border-color:#0d6efd; }
                .visually-hidden { position: absolute; opacity: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
            </style>

            <div class="day-grid">
                <label th:each="dow,iter : ${T(java.time.DayOfWeek).values()}" class="day-chip"
                       th:classappend="${#lists.contains(schedule.daysOfWeek, dow)} ? ' selected' : ''">
                    <input class="visually-hidden" type="checkbox" th:field="*{daysOfWeek}" th:value="${dow}"/>
                    <span th:text="${#strings.capitalize(#strings.substring(dow.name(),0,3).toLowerCase())}">Mon</span>
                </label>
            </div>
            <div id="daysValidationMessage" style="display:none; margin-top: .5rem; color: #842029; background:#f8d7da; border:1px solid #f5c2c7; padding:.5rem .75rem; border-radius: .5rem;">
                Please select at least one day of the week.
            </div>
        </div>

        <label>
            Start Time
            <input type="time" th:field="*{classStartTime}" required/>
        </label>

        <label>
            Duration
            <input type="number" min="1" th:field="*{duration}" placeholder="60"/>
        </label>

        <label>
            Location
            <input type="text" th:field="*{location}" placeholder="e.g., Studio 1, Pool, Outdoor" maxlength="100"/>
            <small style="color:#6c757d; display:block;">Where will this class take place?</small>
        </label>

        <label>
            Slots Available
            <input type="number" min="-1" th:field="*{slots}" placeholder="e.g., 20 or -1 for unlimited"/>
            <small style="color:#6c757d; display:block;">Enter -1 for no defined limit.</small>
        </label>

        <div id="validationMessage" style="display:none; margin: .5rem 0; color: #842029; background:#f8d7da; border:1px solid #f5c2c7; padding:.75rem; border-radius: .5rem;">
            Please provide both a Start Week and a Start Time.
        </div>

        <div class="actions">
            <button class="book-btn" type="submit" th:text="${isEdit} ? 'Save Changes' : 'Create Schedule'">Create Schedule</button>
            <a class="book-btn" style="background: #6c757d;" th:href="@{/instructor/classes}">Cancel</a>
        </div>
    </form>
    <script>
        (function () {
            const form = document.querySelector('form[th\\:object], form[th-object]') || document.querySelector('form');
            if (!form) return;

            // Helper to sync chip UI based on checkbox checked state
            function updateChipStates(container) {
                const chips = (container || form).querySelectorAll('.day-chip');
                chips.forEach(chip => {
                    const input = chip.querySelector('input[type="checkbox"][name="daysOfWeek"]');
                    if (input) {
                        chip.classList.toggle('selected', input.checked);
                    }
                });
            }

            // Toggle chip visuals when user clicks label/checkbox
            form.addEventListener('change', function (e) {
                if (e.target && e.target.matches('input[type="checkbox"][name="daysOfWeek"]')) {
                    updateChipStates();
                }
            });

            // Quick select buttons
            form.querySelectorAll('[data-days-action]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.getAttribute('data-days-action');
                    const boxes = form.querySelectorAll('input[type="checkbox"][name="daysOfWeek"]');
                    const weekendValues = new Set(['SATURDAY', 'SUNDAY']);
                    const mwf = new Set(['MONDAY', 'WEDNESDAY', 'FRIDAY']);
                    const tt = new Set(['TUESDAY', 'THURSDAY']);
                    boxes.forEach(box => {
                        const val = box.value;
                        switch (action) {
                            case 'weekdays':
                                box.checked = !weekendValues.has(val);
                                break;
                            case 'weekends':
                                box.checked = weekendValues.has(val);
                                break;
                            case 'all':
                                box.checked = true;
                                break;
                            case 'mwf':
                                box.checked = mwf.has(val);
                                break;
                            case 'tt':
                                box.checked = tt.has(val);
                                break;
                            case 'clear':
                                box.checked = false;
                                break;
                        }
                    });
                    updateChipStates();
                    // Hide validation if after action there is at least one selected
                    const daysMsg = document.getElementById('daysValidationMessage');
                    const anyChecked = form.querySelectorAll('input[name="daysOfWeek"]:checked').length > 0;
                    if (daysMsg) daysMsg.style.display = anyChecked ? 'none' : 'block';
                });
            });
            form.addEventListener('submit', function (e) {
                const startWeek = form.querySelector('input[name="startWeek"]');
                const startTime = form.querySelector('input[name="classStartTime"]');
                const daysChecked = form.querySelectorAll('input[name="daysOfWeek"]:checked');
                const msg = document.getElementById('validationMessage');
                const daysMsg = document.getElementById('daysValidationMessage');

                let prevent = false;

                // Validate required date/time
                const missing = !startWeek?.value || !startTime?.value;
                if (missing) {
                    prevent = true;
                    if (msg) msg.style.display = 'block';
                } else if (msg) {
                    msg.style.display = 'none';
                }

                // Validate at least one day selected
                if (!daysChecked || daysChecked.length === 0) {
                    prevent = true;
                    if (daysMsg) daysMsg.style.display = 'block';
                } else if (daysMsg) {
                    daysMsg.style.display = 'none';
                }

                if (prevent) {
                    e.preventDefault();
                    // Focus first missing field preference: startWeek, then startTime, then first day checkbox
                    if (startWeek && !startWeek.value) {
                        startWeek.focus();
                    } else if (startTime && !startTime.value) {
                        startTime.focus();
                    } else {
                        const firstDay = form.querySelector('input[name="daysOfWeek"]');
                        if (firstDay) firstDay.focus();
                    }
                }
            });

            // Initialize chip states on load (to reflect any pre-selected days)
            updateChipStates();
        })();
    </script>
</main>
</body>
</html>
