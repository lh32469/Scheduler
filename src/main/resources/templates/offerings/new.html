<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<header>
    <div class="container">
        <div class="header-content">
            <div class="logo">Schedule New Class</div>
            <nav>
                <ul>
                    <li><a th:href="@{/}">Home</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>
<main class="container" style="margin-top: 2rem;">
    <h2>Schedule a New Class</h2>

    <div th:if="${message}"
         th:classappend="${messageType} == 'error' ? ' error' : ' info'"
         style="margin: 1rem 0; padding: 1rem; border-radius: 8px; background: #fdecea; color: #611a15;">
        <span th:text="${message}"></span>
    </div>

    <form th:action="@{/offerings}" method="post" th:object="${schedule}" class="form"
          style="display: grid; gap: 1rem; max-width: 640px;">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label>
            Class Name
            <input type="text" th:field="*{className}" placeholder="Morning Flow Yoga" required/>
        </label>

        <label>
            Class Type
            <select th:field="*{classType}" required>
                <option value="" disabled th:selected="${schedule.classType} == null">Select a class type</option>
                <option th:each="ct : ${T(org.gpc4j.web.api.ClassType).values()}"
                        th:value="${ct}"
                        th:text="${ct}"></option>
            </select>
        </label>

        <label>
            Level
            <input type="text" th:field="*{level}" placeholder="All Levels"/>
        </label>

        <label>
            Start Week (Sunday of first week)
            <input type="date" th:field="*{startWeek}" required/>
        </label>

        <label>
            Number of Weeks (0 = ongoing)
            <input type="number" min="0" th:field="*{numberOfWeeks}"/>
        </label>

        <div>
            <div style="margin-bottom: .25rem; font-weight: 600;">Days of Week</div>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: .5rem 1rem;">
                <label th:each="dow : ${T(java.time.DayOfWeek).values()}" style="display: flex; align-items: center; gap: .5rem;">
                    <input type="checkbox" th:field="*{daysOfWeek}" th:value="${dow}"/>
                    <span th:text="${dow}"></span>
                </label>
            </div>
            <div id="daysValidationMessage" style="display:none; margin-top: .5rem; color: #842029; background:#f8d7da; border:1px solid #f5c2c7; padding:.5rem .75rem; border-radius: .5rem;">
                Please select at least one day of the week.
            </div>
        </div>

        <label>
            Start Time
            <input type="time" th:field="*{classStartTime}" required/>
        </label>

        <label>
            Duration
            <input type="number" min="1" th:field="*{duration}" placeholder="60"/>
        </label>

        <label>
            Slots Available
            <input type="number" min="0" th:field="*{slots}"/>
        </label>

        <div id="validationMessage" style="display:none; margin: .5rem 0; color: #842029; background:#f8d7da; border:1px solid #f5c2c7; padding:.75rem; border-radius: .5rem;">
            Please provide both a Start Week and a Start Time.
        </div>

        <div class="actions">
            <button class="book-btn" type="submit">Create Schedule</button>
            <a class="book-btn" style="background: #6c757d;" th:href="@{/}">Cancel</a>
        </div>
    </form>
    <script>
        (function () {
            const form = document.querySelector('form[th\\:object], form[th-object]') || document.querySelector('form');
            if (!form) return;
            form.addEventListener('submit', function (e) {
                const startWeek = form.querySelector('input[name="startWeek"]');
                const startTime = form.querySelector('input[name="classStartTime"]');
                const daysChecked = form.querySelectorAll('input[name="daysOfWeek"]:checked');
                const msg = document.getElementById('validationMessage');
                const daysMsg = document.getElementById('daysValidationMessage');

                let prevent = false;

                // Validate required date/time
                const missing = !startWeek?.value || !startTime?.value;
                if (missing) {
                    prevent = true;
                    if (msg) msg.style.display = 'block';
                } else if (msg) {
                    msg.style.display = 'none';
                }

                // Validate at least one day selected
                if (!daysChecked || daysChecked.length === 0) {
                    prevent = true;
                    if (daysMsg) daysMsg.style.display = 'block';
                } else if (daysMsg) {
                    daysMsg.style.display = 'none';
                }

                if (prevent) {
                    e.preventDefault();
                    // Focus first missing field preference: startWeek, then startTime, then first day checkbox
                    if (startWeek && !startWeek.value) {
                        startWeek.focus();
                    } else if (startTime && !startTime.value) {
                        startTime.focus();
                    } else {
                        const firstDay = form.querySelector('input[name="daysOfWeek"]');
                        if (firstDay) firstDay.focus();
                    }
                }
            });
        })();
    </script>
</main>
</body>
</html>
