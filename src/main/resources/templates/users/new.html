<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Create User - FitHub</title>
    <link rel="stylesheet" href="/styles.css"/>
    <style>
        .container {
            max-width: 900px;
            margin: 2rem auto;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-grid .full {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: .25rem;
        }

        input, select {
            width: 100%;
            padding: .6rem .8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .actions {
            margin-top: 1rem;
            display: flex;
            gap: .5rem;
        }

        .btn {
            padding: .6rem 1rem;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        .btn.secondary {
            background: #e2e8f0;
            color: #111;
        }
    </style>
</head>

<body>

<header class="container">
    <a href="/" class="btn secondary">← Back to Home</a>
</header>

<main class="container">
    <div class="card">
        <h2 style="margin-top:0">Create User</h2>

        <form method="post" th:action="@{/admin/users}" th:object="${userForm}">
            <div class="form-grid">
                <div>
                    <label for="username">E-Mail Address</label>
                    <input id="username" name="username" type="text" placeholder="user@example.com" required/>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" required/>
                </div>
                <div class="full">
                    <label for="roles">Roles</label>
                    <select id="roles" name="roles" multiple>
                        <option value="USER">USER</option>
                        <option value="INSTRUCTOR">INSTRUCTOR</option>
                        <option value="ADMIN">ADMIN</option>
                    </select>
                </div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            </div>
            <div class="actions">
                <button type="submit" class="btn">Save</button>
                <a href="/" class="btn secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
