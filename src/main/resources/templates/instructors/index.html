<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<header>
    <div class="container">
        <div class="header-content">
            <div class="logo" th:text="${banner.companyName}">FitHub</div>
            <nav>
                <ul>
                    <li><a th:href="@{/}">Home</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>

<main class="container" style="padding-top: 2rem; padding-bottom: 3rem;">
    <h1 th:text="${title}">Instructors</h1>

    <!-- Filter by Class Type -->
    <form th:action="@{/instructors}" method="get" style="margin: 1rem 0;">
        <fieldset style="border:none; padding:0;">
            <legend style="font-weight:400; color:#666; margin-bottom:.5rem; font-size:1.1rem;">Filter by class type:
            </legend>
            <div style="display:flex; flex-wrap:wrap; gap:1rem; align-items:center;">
                <label style="display:flex; align-items:center; gap:.4rem; cursor:pointer; font-size:1.05rem; color:#555;">
                    <input type="radio" name="classType" value=""
                           th:checked="${selectedClassType == null}"
                           onchange="this.form.submit()"
                           style="width:18px; height:18px; cursor:pointer;">
                    <span>All</span>
                </label>
                <label th:each="t : ${allClassTypes}"
                       style="display:flex; align-items:center; gap:.4rem; cursor:pointer; font-size:1.05rem; color:#74d57e;">
                    <input type="radio" name="classType"
                           th:value="${t}"
                           th:checked="${selectedClassType == t}"
                           onchange="this.form.submit()"
                           style="width:18px; height:18px; cursor:pointer;">
                    <span th:text="${#strings.capitalize(t.name())}">Type</span>
                </label>
            </div>
        </fieldset>
    </form>

    <div th:if="${#lists.isEmpty(instructors)}" style="margin-top: 1rem;">
        <p th:if="${selectedClassType == null}">No instructors found.</p>
        <p th:if="${selectedClassType != null}">No instructors found for <span
                th:text="${#strings.capitalize(selectedClassType.name())}">Type</span>.</p>
    </div>

    <div class="schedule-grid" th:if="${!#lists.isEmpty(instructors)}">
        <div class="class-card" th:each="inst : ${instructors}">
            <div class="class-header">
                <div>
                    <div class="class-name" th:text="${inst.name}">Instructor Name</div>
                </div>
            </div>

            <div class="instructor">
                <div class="instructor-bio" th:text="${inst.profile}">Profile</div>
                <!-- Instructor Class Types (aggregated across schedules) -->
                <div class="instructor-class-types"
                     th:with="types=${instructorClassTypes[inst.id]}"
                     style="margin-top:.5rem;">
                    <div th:if="${types != null}"
                         style="display:flex; flex-wrap:wrap; gap:.5rem; align-items:center;">
                        <span style="font-weight:600; color:#555;">Teaches:</span>
                        <span th:each="t : ${types}"
                              th:text="${#strings.capitalize(t.name())}"
                              style="display:inline-block; padding:.2rem .5rem; border-radius:999px; background:#eef6ff; color:#0b5ed7; font-size:.85rem;">
                            ClassType
                        </span>
                    </div>
                    <div th:if="${types == null}"
                         style="margin:.25rem 0 .75rem 0; color:#888; font-size:.9rem;">
                        <span style="font-weight:600; color:#555;">Teaches:</span>
                        None currently scheduled.
                    </div>
                </div>

                <!-- Link to view only this instructor's classes on the main page -->
                <div th:if="${instructorClassTypes[inst.id] != null}"
                     class="instructor-actions" style="margin-top:.75rem;">
                    <a class="filter-btn" th:href="@{/(instructor=${inst.id})}"
                       style="text-decoration:none;">
                        View classes by <span th:text="${inst.name}">this instructor</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="container">
        <p>© <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2025</span>
            <span th:text="${banner.companyName}">FitHub</span>. All rights reserved.
        </p>
    </div>
</footer>

</body>
</html>
