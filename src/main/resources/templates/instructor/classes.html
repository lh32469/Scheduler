<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<header>
    <div class="container">
        <div class="header-content">
            <div class="logo" th:text="${title} ?: 'My Classes'">My Classes</div>
            <nav>
                <ul>
                    <li><a th:href="@{/}">Home</a></li>
                    <li sec:authorize="hasAnyRole('ADMIN','INSTRUCTOR')"><a th:href="@{/offerings/new}">Create Class Offering</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>

<main class="container" style="margin: 2rem auto;">

    <section class="filters" style="padding: 1rem 1.25rem;">
        <h2 style="margin-bottom: 0;">Your Class Offerings</h2>
    </section>

    <div th:if="${#lists.isEmpty(offerings)}" style="background: #fff; padding: 1.5rem; border-radius: 12px; margin-top: 1rem;">
        <p>You don't have any class offerings yet.</p>
        <p>
            <a class="book-btn" style="display: inline-block; width: auto; padding: 0.6rem 1rem; margin-top: 0.5rem;"
               th:href="@{/offerings/new}">Create One</a>
        </p>
    </div>

    <div th:if="${!#lists.isEmpty(offerings)}" class="schedule-grid" style="padding-top: 1rem;">
        <div class="class-card" th:each="off : ${offerings}">
            <div class="class-header">
                <div>
                    <div class="class-name" th:text="${off.className}">Class Name</div>
                </div>
                <div class="class-type" th:text="${off.classType}">Type</div>
            </div>

            <div class="class-details">
                <div class="detail-item">
                    <i class="fas fa-clock"></i>
                    <span th:text="${off.schedule != null ? #temporals.format(off.schedule.start, 'EEE, MMM d • h:mm a') : ''}">Mon, Oct 27 • 7:00 AM</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-signal"></i>
                    <span th:text="${off.level}">All Levels</span>
                </div>
            </div>

            <div class="detail-item" style="color: #28a745; font-weight: 500;">
                <i class="fas fa-users"></i>
                <span th:text="${off.slots} + ' spots remaining • ' + ${off.participants} + ' enrolled'">0 spots remaining • 0 enrolled</span>
            </div>
        </div>
    </div>

    <div style="display: flex; gap: .5rem; margin: 1rem 0;" th:if="${!#lists.isEmpty(offerings)}">
        <a class="book-btn" style="width: auto; background: #6c757d;" th:if="${page > 1}"
           th:href="@{/instructor/classes(page=${page - 1}, size=${size})}">Prev</a>
        <a class="book-btn" style="width: auto;" th:if="${hasNext}"
           th:href="@{/instructor/classes(page=${page + 1}, size=${size})}">Next</a>
    </div>

</main>

</body>
</html>
