<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitHub - Exercise Class Schedule</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #667eea;
        }

        .hero {
            text-align: center;
            padding: 4rem 0;
            color: white;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .filters {
            background: white;
            padding: 2rem 0;
            margin: 2rem 0;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .filter-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 25px;
            background: #f8f9fa;
            color: #333;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .filter-btn.active, .filter-btn:hover {
            background: #667eea;
            color: white;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .class-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .class-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .class-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .class-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d3748;
        }

        .class-type {
            background: #edf2f7;
            color: #4a5568;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .class-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem 1rem;
            margin: 1rem 0;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #4a5568;
        }

        .detail-item i {
            color: #667eea;
        }

        .instructor {
            margin: 1rem 0;
            padding: 1rem;
            background: #f8f9ff;
            border-radius: 12px;
        }

        .instructor-name {
            font-weight: 600;
            color: #2d3748;
        }

        .instructor-bio {
            color: #4a5568;
            font-size: 0.95rem;
            margin-top: 0.25rem;
        }

        .book-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .book-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(118, 75, 162, 0.3);
        }

        footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            padding: 2rem 0 4rem;
        }
    </style>
</head>
<body>
<header>
    <div class="container">
        <div class="header-content">
            <div class="logo">FitHub</div>
            <nav>
                <ul>
                    <li><a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'})">Home</a></li>
                    <li><a href="#schedule">Schedule</a></li>
                    <li><a href="#instructors">Instructors</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>

<main>
    <section class="hero">
        <div class="container">
            <h1>Find Your Perfect Workout</h1>
            <p>Join our diverse range of fitness classes led by expert instructors</p>
        </div>
    </section>

    <section class="container" id="schedule">
        <div class="filters">
            <div class="filter-controls">
                <button class="filter-btn active" data-filter="all">All Classes</button>
                <button class="filter-btn" data-filter="yoga">Yoga</button>
                <button class="filter-btn" data-filter="cardio">Cardio</button>
                <button class="filter-btn" data-filter="strength">Strength</button>
                <button class="filter-btn" data-filter="dance">Dance</button>
                <button class="filter-btn" data-filter="pilates">Pilates</button>
            </div>
        </div>

        <div class="schedule-grid" id="scheduleGrid">
            <div class="class-card"
                 th:each="offering : ${offerings}"
                 th:attr="data-type=${offering.classType}">
                <div class="class-header">
                    <div>
                        <div class="class-name" th:text="${offering.className}">Class Name</div>
                    </div>
                    <div class="class-type" th:text="${offering.classType}">type</div>
                </div>

                <div class="class-details">
                    <div class="detail-item">
                        <i class="fas fa-clock"></i>
                        <span th:text="${#temporals.format(offering.schedule.start, 'EEE, MMM d • h:mm a')}">Mon, Oct 27 • 7:00 AM</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-calendar"></i>
                        <span th:text="${#temporals.dayOfWeekName(offering.schedule.start)}">Monday</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-hourglass-half"></i>
                        <span th:text="${offering.schedule.duration}">60 min</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-signal"></i>
                        <span th:text="${offering.level}">All Levels</span>
                    </div>
                </div>

                <div class="instructor">
                    <div class="instructor-name">
                        <i class="fas fa-user"></i>
                        <span th:text="${offering.instructor != null ? offering.instructor.name : ''}">Instructor</span>
                    </div>
                    <div class="instructor-bio" th:text="${offering.instructor != null ? offering.instructor.bio : ''}">
                        Bio
                    </div>
                </div>

                <div class="detail-item" style="color: #28a745; font-weight: 500;">
                    <i class="fas fa-users"></i>
                    <span th:text="${offering.slots} + ' spots available'">0 spots available</span>
                </div>

                <button class="book-btn"
                        onclick="bookClass(this)"
                        th:attr="
                          data-name=${offering.className},
                          data-type=${offering.classType},
                          data-time=${offering.schedule.time},
                          data-start=${offering.schedule.start},
                          data-day=${offering.schedule.day},
                          data-duration=${offering.schedule.duration},
                          data-level=${offering.level},
                          data-instructor=${offering.instructor != null ? offering.instructor.name : ''},
                          data-bio=${offering.instructor != null ? offering.instructor.bio : ''},
                          data-slots=${offering.slots}">
                    <i class="fas fa-bookmark"></i> Book This Class
                </button>
            </div>
        </div>
    </section>
</main>

<footer>
    <div class="container">
        <p>© <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2025</span> FitHub. All rights
            reserved.</p>
    </div>
</footer>

<script>
    function setupFilters() {
        const buttons = document.querySelectorAll('.filter-btn');
        const cards = document.querySelectorAll('.class-card');
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                cards.forEach(card => {
                    const type = card.getAttribute('data-type');
                    const show = (filter === 'all') || (type === filter);
                    card.style.display = show ? '' : 'none';
                });
            });
        });
    }

    async function bookClass(button) {
        const original = button.innerHTML;
        const payload = {
            className: button.dataset.name || 'Untitled Class',
            classType: button.dataset.type || 'general',
            schedule: {
                time: button.dataset.time || '',
                day: button.dataset.day || '',
                start: button.dataset.start || '',
                duration: button.dataset.duration || ''
            },
            level: button.dataset.level || '',
            instructor: {
                name: button.dataset.instructor || '',
                bio: button.dataset.bio || ''
            },
            availability: (button.dataset.slots || '0') + ' spots available',
            bookingTimestamp: new Date().toISOString(),
            customerInfo: {
                bookingId: 'BOOK_' + Date.now(),
                requestSource: 'website'
            }
        };

        try {
            button.disabled = true;
            button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Booking...';
            const res = await fetch('/api/bookings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('Server error ' + res.status);
            const result = await res.json();
            console.log('Server response:', result);
            window.location.reload();
            if (result.status === 'stored') {
                alert(`✅ Booking Confirmed!\n\nClass: ${payload.className}\nBooking ID: ${payload.customerInfo.bookingId}`);
            } else {
                alert(`❌ Booking failed: ${result.status}`);
            }
        } catch (e) {
            console.error('Booking error:', e);
            alert('❌ Booking failed: ' + e.message);
        } finally {
            button.disabled = false;
            button.innerHTML = original;
            window.location.reload();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        setupFilters();
        document.querySelectorAll('nav a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) target.scrollIntoView({behavior: 'smooth'});
            });
        });
    });
</script>
</body>
</html>
