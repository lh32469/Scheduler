<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head}"></head>

<body>

<header>
    <div class="container">
        <div class="header-content">
            <div class="logo">FitHub</div>
            <nav>
                <ul>
                    <li><a href="#" onclick="window.scrollTo({top:0,behavior:'smooth'})">Home</a></li>
                    <li><a href="#schedule">Schedule</a></li>
                    <li><a href="#instructors">Instructors</a></li>
                    <li><a href="#contact">Contact</a></li>
                    <li>
                        <form th:action="@{/logout}" method="post" style="display: inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <a href="#" onclick="this.parentElement.submit(); return false;">Logout</a>
                        </form>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</header>

<main>
    <section class="hero">
        <div class="container">
            <h1>Find Your Perfect Workout</h1>
            <p>Join our diverse range of fitness classes led by expert instructors</p>
        </div>
    </section>

    <section class="container" id="schedule">
        <div class="filters">
            <div class="filter-controls">
                <button class="filter-btn" onclick="window.location.href='/'">All Classes</button>
                <button class="filter-btn" onclick="window.location.href='?filter=yoga'">Yoga</button>
                <button class="filter-btn" onclick="window.location.href='?filter=cardio'">Cardio</button>
                <button class="filter-btn" onclick="window.location.href='?filter=strength'">Strength</button>
                <button class="filter-btn" onclick="window.location.href='?filter=dance'">Dance</button>
                <button class="filter-btn" onclick="window.location.href='?filter=pilates'">Pilates</button>

            </div>
        </div>


        <!-- Flash message from redirect -->
        <div th:if="${message}"
             th:classappend="${messageType} == 'error' ? ' error' : ' info'"
             style="margin: 1rem 0; padding: 1rem; border-radius: 8px; background: #fdecea; color: #611a15;">
            <span th:text="${message}"/>
        </div>

        <div class="schedule-grid" id="scheduleGrid">
            <div class="class-card" style="animation-delay: 0s"
                 th:each="offering : ${offerings}"
                 th:attr="data-type=${offering.classType}">

                <div class="class-header">
                    <div>
                        <div class="class-name" th:text="${offering.className}">Class Name</div>
                    </div>
                    <div class="class-type" th:text="${offering.classType}">type</div>
                </div>

                <div class="class-details">
                    <div class="detail-item">
                        <i class="fas fa-clock"></i>
                        <span th:text="${#temporals.format(offering.schedule.start, 'EEE, MMM d • h:mm a')}">Mon, Oct 27 • 7:00 AM</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-calendar"></i>
                        <span th:text="${#temporals.dayOfWeekName(offering.schedule.start)}">Monday</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-hourglass-half"></i>
                        <span th:text="${offering.schedule.duration}">60 min</span>
                    </div>
                    <div class="detail-item">
                        <i class="fas fa-signal"></i>
                        <span th:text="${offering.level}">All Levels</span>
                    </div>
                </div>

                <div class="instructor">
                    <div class="instructor-name">
                        <i class="fas fa-user"></i>
                        <span th:text="${offering.instructor != null ? offering.instructor.name : ''}">Instructor</span>
                    </div>
                    <div class="instructor-bio" th:text="${offering.instructor != null ? offering.instructor.bio : ''}">
                        Bio
                    </div>
                </div>

                <div class="detail-item" style="color: #28a745; font-weight: 500;">
                    <i class="fas fa-users"></i>
                    <span th:text="${offering.slots} + ' spots available'">0 spots available</span>
                </div>

                <form th:action="@{/api/bookings/v2}"
                      method="post"
                      class="form">
                    <input type="hidden" name="className"
                           th:value="${offering.className}"/>
                    <input type="hidden" name="classType"
                           th:value="${offering.classType}"/>
                    <input type="hidden" name="level"
                           th:value="${offering.level}"/>
                    <input type="hidden" name="schedule.start"
                           th:value="${offering.schedule.start}"/>
                    <!-- User info -->
                    <input type="hidden" name="customerInfo.requestSource"
                           th:value="${#authentication?.name != null ? #authentication.name : 'anonymous'}"/>
                    <input type="hidden" name="customerInfo.bookingId"
                           th:value="${T(java.util.UUID).randomUUID()}"/>
                    <!-- CSRF token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div>
                        <button class="book-btn" type="submit">Book</button>
                    </div>
                </form>

            </div>
        </div>
    </section>
</main>

<footer>
    <div class="container">
        <p>© <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2025</span> FitHub. All rights
            reserved.</p>
    </div>
</footer>

</body>
</html>
