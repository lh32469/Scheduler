<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'Login - ' + ${banner.companyName}">Login</title>
    <link rel="stylesheet" href="/styles.css"/>
    <style>
        .login-container {
            max-width: 420px;
            margin: 6rem auto;
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .login-title {
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.6rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .input {
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .btn {
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: #fff;
            cursor: pointer;
            font-weight: 600;
        }

        .btn:hover {
            background: #5569d6;
        }

        .msg {
            margin-bottom: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 8px;
        }

        .msg.error {
            background: #fdecea;
            color: #611a15;
        }

        .msg.info {
            background: #e6f4ff;
            color: #084298;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div th:text="'Sign in to ' + ${banner.companyName}" class="login-title">Sign in</div>

    <div th:if="${param.error}" class="msg error">Invalid username or password.</div>
    <div th:if="${param.verified}" class="msg info">Your account has been activated. You can now sign in with your new password.</div>
    <div th:if="${param.logout}" class="msg info">You have been logged out.</div>

    <form class="login-form" th:action="@{/login}" method="post">
        <input class="input" type="text" name="username" placeholder="Username" required/>
        <input class="input" type="password" name="password" placeholder="Password" required/>
        <button class="btn" type="submit">Sign in</button>
    </form>

    <!-- Link to Sign Up -->
    <div style="margin-top:.75rem; text-align:center;">
        <span style="color:#555;">Don't have an account?</span>
        <a th:href="@{/signup}"
           style="margin-left:.35rem; color:#667eea; font-weight:600; text-decoration:none;">Sign Up</a>
    </div>
</div>
</body>
</html>
