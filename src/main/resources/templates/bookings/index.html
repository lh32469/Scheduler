<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
>
<head th:replace="~{fragments/head :: head}"></head>

<style>
    .class-details {
        width: 100%;
        border-collapse: collapse;
    }

    .detail-label {
        font-weight: bold;
        padding: 8px;
        width: 150px;
    }

    .detail-value {
        padding: 8px;
    }
</style>

<body>
<header>
    <div class="container">
        <div class="header-content">
            <div class="logo" th:text="${title} ?: 'My Bookings'">My Bookings</div>
            <nav>
                <ul>
                    <li><a th:href="@{/}">Home</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>


<main class="container" style="margin: 2rem auto;">

    <!-- Flash message from redirect -->
    <div th:if="${message}"
         th:classappend="${messageType} == 'error' ? ' error' : ' info'"
         style="margin: 1rem 0; padding: 1rem; border-radius: 8px; background: #fdecea; color: #611a15;">
        <span th:text="${message}"/>
    </div>

    <section class="filters" style="padding: 1rem 1.25rem;">
        <h2 style="margin-bottom: 0;">Your Bookings</h2>
    </section>

    <div th:if="${#lists.isEmpty(bookings)}"
         style="background: #fff; padding: 1.5rem; border-radius: 12px; margin-top: 1rem;">
        <p>You don't have any bookings yet.</p>
        <p>
            <a class="book-btn" style="display: inline-block; width: auto; padding: 0.6rem 1rem; margin-top: 0.5rem;"
               th:href="@{/#schedule}">Browse Classes</a>
        </p>
    </div>

    <div th:if="${!#lists.isEmpty(bookings)}" class="schedule-grid" style="padding-top: 1rem;">
        <div class="class-card"
             th:each="booking, iter : ${bookings}">
            <div class="class-header">
                <div>
                    <div class="class-name"
                         th:text="${booking.className}"/>
                </div>
                <div class="class-type" th:text="${booking.classType}"/>
            </div>

            <table class="class-details" style="display: table !important; width: 100%; border-collapse: collapse;">
                <tr>
                    <td class="detail-label">Class Starts:</td>
                    <td class="detail-value"
                        th:text="${#temporals.format(booking.classStart, 'EEE, MMM d, h:mma')}"/>
                </tr>
                <tr>
                    <td class="detail-label">Instructor:</td>
                    <td class="detail-value"
                        th:text="${booking.instructorName}"/>
                </tr>
                <tr>
                    <td class="detail-label" style="width: 40%">Level:</td>
                    <td class="detail-value"
                        th:text="${booking.level}"/>
                </tr>
                <tr>
                    <td class="detail-label">Booked On:</td>
                    <td class="detail-value"
                        th:text="${#temporals.format(booking.dateBooked, 'EEE, MMM d')}"/>
                </tr>
            </table>

            <form th:action="@{/bookings/cancel}" method="post" class="form" style="margin-top: .5rem;">
                <input type="hidden" name="bookingId" th:value="${booking.id}"/>
                <input type="hidden" name="page" th:value="${page}"/>
                <input type="hidden" name="size" th:value="${size}"/>
                <div class="actions">
                    <button class="book-btn" type="submit" style="width: auto; background: #dc3545;"
                            onclick="return confirm('Cancel this booking?');">Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div style="display: flex; gap: .5rem; margin: 1rem 0;" th:if="${!#lists.isEmpty(bookings)}">
        <a class="book-btn" style="width: auto; background: #6c757d;" th:if="${page > 1}"
           th:href="@{/bookings(page=${page - 1}, size=${size})}">Prev</a>
        <a class="book-btn" style="width: auto;" th:if="${hasNext}"
           th:href="@{/bookings(page=${page + 1}, size=${size})}">Next</a>
    </div>

</main>

</body>
</html>
