<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="'Set Your Password - ' + ${banner.companyName}">Set Password</title>
    <link rel="stylesheet" href="/styles.css"/>
    <head th:replace="~{fragments/head :: head}"></head>
</head>
<body>
<header>
    <div class="container">
        <div class="header-content">
            <div class="logo">Set Your Password</div>
            <nav>
                <ul>
                    <li><a th:href="@{/}">Home</a></li>
                    <li><a th:href="@{/login}">Login</a></li>
                </ul>
            </nav>
        </div>
    </div>
    </header>

<main class="container" style="max-width: 720px; margin: 2rem auto;">
    <div class="class-card">
        <h2 style="margin-top:0">Welcome<span th:if="${name != null}">, <span th:text="${name}">User</span></span></h2>
        <p th:if="${email != null}" style="color:#555; margin-top:.25rem;">Setting password for <strong th:text="${email}">email</strong></p>

        <div class="msg error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/verify}" method="post" th:object="${setPassword}" style="display:grid; gap:.75rem; max-width:520px;">
            <input type="hidden" th:field="*{token}"/>

            <label style="font-weight:600;">New Password
                <input type="password" th:field="*{password}" placeholder="••••••••" required/>
            </label>

            <label style="font-weight:600;">Confirm Password
                <input type="password" th:field="*{confirmPassword}" placeholder="••••••••" required/>
            </label>

            <small style="color:#6c757d;">Password must be at least 8 characters and include a letter and a number.</small>

            <div class="actions" style="margin-top:.5rem; display:flex; gap:.5rem;">
                <button class="book-btn" type="submit">Save Password</button>
                <a class="book-btn" style="background:#6c757d;" th:href="@{/}">Cancel</a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
